[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-auto-permission-assistant"
version = "1.0.0"
description = "Lightweight desktop assistant and safety policy engine for Google Antigravity AI permission prompts."
readme = "README.md"
authors = [
  { name = "Google Antigravity Developer Community" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "pydantic>=2.0.0",
  "PySide6>=6.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.1.0",
  "pyinstaller>=6.0.0",
]

[project.scripts]
aapa = "aapa.main:main"
aapa-hook = "aapa.hook:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --strict-markers"
